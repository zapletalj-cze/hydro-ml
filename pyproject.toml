# JVe testing environment
[project]
dependencies = []
name = "gis"
requires-python = ">= 3.12"  # Minimum Python version required
version = "0.1.0"
description = "GIS analysis package"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# Pixi workspace configuration for conda environment management
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]  # Windows 64-bit only





[tool.pixi.tasks]
# Add custom tasks here

[project.optional-dependencies]
dev = ["jupyter>=1.1.1,<2", "ipykernel>=7.1.0,<8"]

[tool.pixi.dependencies]
# Runtime libraries required by levee_detection.ipynb
python = ">=3.12,<3.13"
pip = "*"

numpy = ">=2.3.5,<3"
pandas = ">=2.3.3,<3"
geopandas = ">=1.1.1,<2"
pyogrio = ">=0.11,<0.13"
gdal = ">=3.10.0,<4"
xarray = ">=2025.11.0,<2026"
rioxarray = ">=0.19.0,<0.20"
tqdm = ">=4.67.1,<5"

xgboost = ">=2.1.3,<3"
scikit-learn = ">=1.7.2,<2"
matplotlib = ">=3.10.8,<4"

# Notebook support
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.1.0,<8"
dask = ">=2026.3.0,<2027"
libgdal-hdf5 = ">=3.12.2,<4"
h5py = ">=3.16.0,<4"
icepyx = ">=1.3.0,<2"
earthaccess = ">=0.17.0,<0.18"


[project]
name = "geo-approach"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["win-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
pip = ">=26.0.1,<27"
pytorch = ">=2.5.1"
torchvision = ">=0.20.1,<0.21"
pytorch-cuda = "12.4.*"
pandas = ">=3.0.2,<4"
geopandas = ">=1.1.3,<2"
ipykernel = ">=7.2.0,<8"
jupyter = ">=1.1.1,<2"
tqdm = ">=4.67.3,<5"
segmentation-models-pytorch = ">=0.5.0,<0.6"
black = ">=26.3.1,<27"
gdal = ">=3.13.0,<4"
scikit-image = ">=0.26.0,<0.27"
h5py = ">=3.16.0,<4"
xgboost = ">=3.3.0,<4"

domain_directory_source: D_local  ##D_local ##   P132_e2 ## 'B' - Source location of input domains - other options e.g. 'D_local', 'P005_e'
code_buffer: "10"  ##msa what is it?
Q_peril: "pl_city"  ## 'fl'|'rf'|'pl': 'fl' - fluvial, 'pl' - pluvial,'pl_city' - pluvial for city,
pluvial_resolution_mesh: "10"  ## '5'|'10'|'30' - pluvial resolution of computetional, only for pluvial peril
pluvial_resolution: "1"  ## '1'|'5'|'10'|'30' - pluvial -  resolution of , mainly DTM (can be 1m for lidar DTM, despite that computational mesh has resolution 5m; only for pluvial peril


project_start_scenario: 173_Nordics_Flood     ## project name for start scenario, e.g. '157_Canada_Flood', '157_Canada_Flood/msa', ...
project: 173_Nordics_Flood                        ## project name for the machine path, e.g. '157_Canada_Flood' - will be combined with 01_Projects/{project}/01_MD/06_TUFLOW...
temp: C:\temp_pl_city                               ## temp folder for processing

multi_scenario: pl_RPall_HPC_SGS_1m_VPs_05m_tunnel_os10_20h
multiscenario_test: pl_RP5_10k_test_HPC_SGS_1m_VPs_05m_tunnel_os10_2h # if is_test_run is True, this scenario will be used instead of multi_scenario for testing purposes

## use multiprocessing for extraction
use_multiprocessing: False  ## use multiprocessing for extraction - set "true" to use multiprocessing
multiprocessing_cores: 40 ## number of cores to use for multiprocessing

user_dirs:
  R:\01_Projects\173_Nordics_Flood\01_MD\01_HAZARD\06_TUFLOW_PL\_dtd_PL\_cities\N05_pluvial_reference.csv # DOMAINS TO DO

main_setup_yaml: D:\90_PersonalFoldlers\JZa\00_GIT\European_flood\01_HAZARD\06_TUFLOW\02_TU_domains\02_Pluvial\02_extract_domains\_yaml\setup_N05_1m_10m.yaml ## YAML file created using PL01_get_inputs
is_test_run: False



tu_what_to_do:
  Q_Do_DTM: true            # create DTM raster - set "true"
  Q_Do_DTM_add: false        # create DTM raster from additional layers, e.g. buildings, waterbodies...
  Q_Do_ZSH_dtm_polygon: false # create zsh polygon for removing holes and gaps in the DTM
  Q_Do_ZSH_dtm_add_L: false # create zsh line for ADD elevation in the DTM
  Q_Do_Manning: true        # create material (2d_mat* layer) - set "true"
  Q_Do_Soil: true           # create soil (2d_soil* layer) - set "true"
  Q_Do_Drainage: false       # create drainage (2d_soil_drain* layer) - set "true"
  Q_Do_BC_Dbase_local: false  # create copy of the hydrology into given domain, the hydrology inputs must exist in the CommonInput folder on the source-drive
  Q_Do_ZSH_Levees: false      # create local ZSH lines based on the global layer: levees
  Q_Do_ZSH_Channels: false    # create local ZSH lines based on the global layer: channel
  Q_Do_ZSH_Culverts: false    # create local ZSH lines based on the global layer: culverts
  Q_Do_Mannig_Culvert_channel: false # change value in 2d_mat file for culverts and channels, 2d_mat must already exist in the domain
  Q_Do_VP: true              # create inlets for virtual pipes (1d_pit* layer) - set "true"
  Q_Do_TUFLOW_files: true    # create all TUFLOW text files + copy commoninputs- e.g. .tcf, .tgc....
  Q_Do_Create_Yaml: true      # crete a scenario to start the computation on the server



tu_zsh_lines_switch:
  ##CULVERTS:
  zsh_culvert_CFW: 0.7  #0.5  # (interval 0-100% - reduction of the capacity)
  zsh_culvert_FLC: 0
  zsh_culvert_dZ: 0
  ##CHANNELS:
  zsh_channel_dZ: -0.75
  ##LEVEES:
  zsh_levee_dZ: 0.0


tu_values_default:
  Select_DTM_by: "city" ## watershed, domain, city (area...)
  Select_drainage_by: "city" ## watershed, domain (area...)
  Set_Zpts: -0.5  ## for TGC command Set Zpts == -0.5 (default elevation of terrain)
  Set_Mat: 1  ## for TGC command Set Mat == 501 (default material ID)
  Set_Soil: 3  ## for TGC command Set Soil == 501 (default soil ID) - Set up value is necessary only if soil is used
  Set_Soil_Other: 33  ## for TGC command Set
  Set_IWL: -10  ## for TGC command Set IWL == 501  (default initial water level)
  Set_Zpts_Order: 'levees_first'  ## 'auto' - order by the list = preferred option!; #'default' = 'levees_last'; 'levees_first'
  Channel_value: 80  # value that will be set to 2d_mat file for the channel/culvert
  Channel_width: 8  # width of the channel/culvert for 2d mat file
  Precision: "iSP"  ## default: 'iSP' - integer, single precision; 'dDP' - double precision
  Auto_Restart: False  # only for fluvial, if Q_Peril is pl, it will be False, otherwise up to the modeler
  Max_Time: 200  # max time for automatic restart
  Time_Shift: 10  # max time for time shift


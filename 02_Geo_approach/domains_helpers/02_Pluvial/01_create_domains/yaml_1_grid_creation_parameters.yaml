# Grid Creation Parameters for European Flood Project
# This configuration file defines the parameters used in the creation of grids for flood modeling.

epsg:
  3035

# region_buffer: The buffer distance (in meters) around the region of interest.
# This ensures that the grid covers a slightly larger area than the actual region.
region_buffer:
  4000

# one_grid_size: The size (in meters) of one side of the square grid. This defines the resolution of the grid.
one_grid_size:
  8000

# code_size: The size (in meters) for coding purposes, possibly related to internal grid coding or segmentation.
code_size:
  1000

# clip_size: The size (in meters) used for clipping operations.
clip_size:
  4000

# bc_out_size: The size (in meters) defining the boundary conditions output.
bc_out_size:
  600

# starting_letter: The starting letter used for naming grids or domains.
starting_letter:
  G

# create_shifted_grid: A boolean flag indicating whether a second, shifted grid should be created.
create_shifted_grid:
  True

# second_grid_shift: The shift distance (in meters) for the second grid, if created.
second_grid_shift:
  4000

# grids_one_area: The minimum number of grids in one dimension (X or Y) that should cover an area.
grids_one_area: # X * Y > 15 * 15 for example
  15

# inside_region: A boolean flag indicating whether only grids intersecting with the region of interest should be used.
inside_region: # use only intersecting grids with the region
  False

# out_grid: The file path to the output geopackage (.gpkg) file where the created grid will be saved.
# This is the primary output of the grid creation process.
out_grid:
  V:\01_Projects\900_FL_Europe\01_MD\01_HAZARD\06_TUFLOW_PL\05_domains\grid\EUROPE_GRID_3035_8km_ISO3.gpkg

# out_folder_domains: The folder path where domain-related files or outputs will be stored.
out_folder_domains:
  D:\01_Projects\900_FL_Europe\01_MD\01_HAZARD\06_TUFLOW_PL

# Path to the Intensity-Duration-Frequency (IDF) grid as a GeoPackage
idf_grid:
  V:\01_Projects\900_FL_Europe\02_DATA\02_IDF\IDF_GRID_5500_LCC_eu_clipped_260202.gpkg

# Column name in the IDF grid containing the IDF ID
idf_grid_column:
  IDFID

# Flag to enable or disable multicore processing
multicore:
  False

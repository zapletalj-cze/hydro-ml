# Pristine fluvial setup template.
# FL01_get_inputs_from_db.py reads this file, fills the DB-derived keys
# (d_DTM_path, manning_default, zsh_*, DTM_add_path) and writes the result to
# main_setup_fluvial.yaml, which tu_input_sources.py consumes.
# Keep the static keys below up to date per project; FL01 only overwrites the
# DB-derived keys.

tuflow_version: 2026-0-1 # verstion of TUFLOW used for modelling
write_check_files: True
epsg: 3035 # epsg of projection used in the project, also name in the common inputs
tuflow_yaml_path: # path to the TUFLOW scenario folder
  D:\01_Projects\173_Nordics_flood\01_MD\01_HAZARD\06_TUFLOW_FL\_start_yaml

database_schema:
  TUFLOW_Europe.dbo  # to be filled with the new name

# scenario metadata written into each per-domain YAML (Q_Do_Create_YAML) - fill per project
project:
  173_Nordics_flood
peril_path:
  06_TUFLOW_FL
project_start_scenario:
  173_Nordics_flood

d_DTM_path: {}   # filled by FL01 from DB: {AREA: {resolution: link}}
snap_raster:
  R:\01_Projects\900_FL_Europe\01_MD\01_HAZARD\00_GIS\01_SnapRaster\SNAP_3035_30m.tif

domains_list: # list of all domains and DTM resolution

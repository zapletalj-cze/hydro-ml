# User configuration for the fluvial TUFLOW extract pipeline (01_tu_extract_run.py).
# Loaded by tu_data.py. The y/n flags MUST stay quoted strings - PyYAML would
# otherwise read bare y/n as booleans and the "== 'y'" checks would never fire.

### Choose basic source, area, resolution and peril for TUFLOW computation:
domain_directory_source: D_local   ## 'B' - source location of input domains - other options e.g. 'D_local', 'P005_e'
area: N05                          ## tuflow area name: 'A42', 'W42'...
code_buffer: "30"
Q_peril: fl                        ## 'fl'|'rf'|'pl': 'fl' - fluvial, 'pl' - pluvial
TUFLOW_server: D_local             ## nickname of the TUFLOW server - where domain will be sent for computation

temp: d:\01_Projects\157_Canada_Flood_v3\01_MD\01_HAZARD\01_DTM\tmp

### Select scenarios for TUFLOW domain computation:
use_scenario: multi                ## multi | manual - use predefined CSV scenario in 03_bat/multi folder, or manual created scenario
multi_scenario: fl_RPall_C_HPC_5m
# multi_scenario: fl_RPall_major_lp   fl_RPall_major_lp_rest   fl_RPall_major_lp_5_1h_10k

### USER defined domains for modification (leave empty to auto-discover from the workspace):
user_dirs:
# - M06_74000027
# - M06_74000028

user_dirs_condition_values:        ## filter dirs between two values; to filter creeks use [5000, 10000]
  - 0
  - 9999999999

### Update domain by raster and hydrology, TUFLOW text files creation, create scenarios, sending to the computational server
tu_what_to_do:
  Q_Do_DTM: "n"                     ## create DTM raster - set "y"
  Q_Do_DTM_add: "n"                 ## create DTM raster from additional layers, e.g. buildings, waterbodies...
  Q_Do_Manning: "n"                 ## create material (2d_mat* layer) - set "y"
  Q_Do_Soil: "n"                    ## create soil (2d_soil* layer) - set "y"
  Q_Do_Drainage: "n"               ## create drainage (2d_soil_drain* layer) - set "y"
  Q_Do_BC_Dbase_local: "n"         ## copy hydrology into given domain (inputs must exist in CommonInput on the source-drive)
  Q_Do_ZSH_Levees: "n"             ## create local ZSH lines based on the global layer: levees
  Q_Do_ZSH_Channels: "n"           ## create local ZSH lines based on the global layer: channel
  Q_Do_ZSH_Culverts: "n"           ## create local ZSH lines based on the global layer: culverts
  Q_Do_Mannig_Culvert_channel: "n" ## change value in 2d_mat file for culverts and channels (2d_mat must already exist)
  Q_Do_TUFLOW_files: "n"           ## create all TUFLOW text files - e.g. .tcf, .tgc....
  Q_Do_CopyDomains_to_server: "n"  ## DISABLED - replaced by FL03_tuflow_test_run.py + FL04_copy_to_distribution.py (forced off in tu_data.py)
  Q_Do_Create_Scenario: "n"        ## create a scenario to start the computation on the server
  Q_Do_Create_YAML: "y"            ## create per-domain YAML (project/peril_path/project_start_scenario must be set in main_setup_fluvial.yaml)

### Modify parameters of ZSH lines extracted into domains
tu_zsh_lines_switch:
  ##CULVERTS:
  zsh_culvert_CFW: 0.7             ## interval 0-100% - reduction of the capacity
  zsh_culvert_FLC: 0
  zsh_culvert_dZ: 0
  ##CHANNELS:
  zsh_channel_dZ: 0               ## -0.75
  ##LEVEES:
  zsh_levee_dZ: 0.0

### TUFLOW defaults - changeable by user:
tu_values_default:
  TUFLOW_release: "2023-03-AF"
  bc_dbase_location: "local"      ## 'CommonInputs', 'local' - in domain
  Set_Zpts: -0.5                  ## TGC command Set Zpts == -0.5 (default elevation of terrain)
  Set_Mat: 1                      ## TGC command Set Mat (default material ID)
  Set_Soil: 1                     ## TGC command Set Soil (default soil ID) - only needed if soil is used
  Set_IWL: -10                    ## TGC command Set IWL (default initial water level)
  Set_Zpts_Order: "auto"          ## 'auto' - order by the list (preferred); 'default' = 'levees_last'; 'levees_first'
  Q_Use_VirtualPipes: "y"         ## 'y' = use VP only if available; 'no' - never use VP
  channel_value: 80               ## value set to 2d_mat file for the channel/culvert
  channel_width: 30               ## width of the channel/culvert for 2d mat file

### configuration for batfiles - fluvial
tu_bat_variables_fl:
  scenarios:
    start_time: s0
    end_time: e40
    method: H00
    dtm_res: D05                  ## edit by DTM
    output_time: o10
    output_size: ms5              ## edit by DTM
    restart: Hu
  events:
    infiltration: ["I"]
    inflow: ["C"]
    rp:
      - f00005
      - f00020
      - f00050
      - f00100
      - f00200
      - f00500
      - f01000
      - f10000

### configuration for batfiles - rainfall
tu_bat_variables_rf:
  scenarios:
    start_time: s0
    end_time: e24
    method: Q00
    dtm_res: D01
    output_time: o24
    output_size: ms10
    restart: Hs
  events:
    infiltration: ["I00", "I50", "I90"]
    inflow: ["d360", "d1440"]
    rp:
      - r00005
      - r00020
      - r00050
      - r00100
      - r00200
      - r00500
      - r01000
      - r10000
